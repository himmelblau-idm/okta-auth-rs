[package]
name = "okta-auth-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "LGPL-3.0-or-later AND Apache-2.0"
description = "Native Okta Identity Engine authentication for Rust"
repository = "https://github.com/himmelblau-idm/okta-auth-rs"
readme = "../../README.md"

[lib]
name = "okta"

[features]
default = []
proxyable = []
hsm = ["dep:kanidm-hsm-crypto", "dep:crypto-glue"]
tpm = ["hsm", "kanidm-hsm-crypto/tpm"]
webauthn-usb = ["dep:authenticator", "dep:serde_cbor"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
zeroize.workspace = true
indexmap = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
regex = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
cookie_store = "0.22"
kanidm-hsm-crypto = { version = "=0.3.6", optional = true, default-features = false }
crypto-glue = { version = "=0.1.18", optional = true }
authenticator = { version = "0.5", optional = true, default-features = false, features = ["crypto_rust"] }
serde_cbor = { version = "0.11", optional = true }
base64 = "0.22"

ring = "0.17"
url = "2"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
