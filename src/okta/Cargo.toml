[package]
name = "libokta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Okta Identity Engine authentication for Rust"
repository = "https://github.com/himmelblau-idm/okta-auth-rs"
readme = "../../README.md"

[lib]
name = "okta"

[features]
default = []
hsm = ["dep:kanidm-hsm-crypto", "dep:crypto-glue"]
tpm = ["hsm", "kanidm-hsm-crypto/tpm"]
webauthn-usb = ["dep:authenticator", "dep:serde_cbor", "dep:base64"]

[dependencies]
okta-native-support = { package = "okta-auth-rs", version = "=8.0.1", path = "../runtime" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
zeroize.workspace = true
kanidm-hsm-crypto = { version = "=0.3.6", optional = true, default-features = false }
crypto-glue = { version = "=0.1.18", optional = true }
authenticator = { version = "0.5", optional = true, default-features = false, features = ["crypto_rust"] }
serde_cbor = { version = "0.11", optional = true }
base64 = { version = "0.22", optional = true }

ring = "0.17"
url = "2"
