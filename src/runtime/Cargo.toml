[package]
name = "okta-auth-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native runtime support for Rust code generated from Okta Auth JS"
repository = "https://github.com/himmelblau-idm/okta-auth-rs"
readme = "../../README.md"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true
indexmap = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
ring = "0.17"
base64 = "0.22"
url = "2"
regex = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

cookie_store = "0.22"
